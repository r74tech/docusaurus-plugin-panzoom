name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          runtime: node@24.14.0
          cache: true
          cache-dependency-path: |
            pnpm-lock.yaml
            docs/pnpm-lock.yaml
          install: false

      # Install root project dependencies and build plugin
      - name: Install plugin dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build plugin
        run: pnpm build

      # Install docs dependencies and build docs
      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build docs website
        working-directory: docs
        env:
          DOCS_BASE_URL: ${{ github.event_name == 'pull_request' && format('/docusaurus-plugin-panzoom/pr-preview/pr-{0}/', github.event.number) || '/docusaurus-plugin-panzoom/' }}
        run: pnpm build

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: documentation
          path: docs/build
          include-hidden-files: true

  deploy:
    name: Deploy Documentation
    if: >-
      always() && !cancelled() &&
      (needs.build.result == 'success' || github.event.action == 'closed') &&
      ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download documentation
        if: github.event.action != 'closed'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: documentation
          path: docs/build

      - name: Deploy production
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          folder: docs/build
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

      - name: Deploy or remove PR preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1
        with:
          source-dir: docs/build
          preview-branch: gh-pages
          qr-code: false
