name: Docusaurus PanZoom Plugin CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          install: false
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm" npm@11.19.1
          echo "$RUNNER_TEMP/npm/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify release tooling
        run: |
          node --version
          npm_version="$(pnpm exec npm --version)"
          echo "npm $npm_version"
          test "$npm_version" = "11.19.1"
      - name: Build
        run: pnpm build
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
